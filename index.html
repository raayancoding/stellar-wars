<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05070f" />
  <meta name="description" content="Stellar Wars: Last Defense — a modern arcade space shooter." />
  <title>Stellar Wars: Last Defense</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070d1a'/%3E%3Cpath d='M16 5l3.4 7.6L27 16l-7.6 3.4L16 27l-3.4-7.6L5 16l7.6-3.4z' fill='%234fe3ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles/main.css?v=23" />
</head>
<body>
  <div id="game-root">
    <canvas id="renderCanvas" touch-action="none"></canvas>
    <div id="bg-shade"></div>
    <div id="vignette"></div>
    <div id="scanlines"></div>

    <div id="ui" aria-live="polite"></div>
    <div id="hud" class="hidden"></div>
    <div id="toast-layer"></div>

    <div id="loading" class="boot">
      <div class="loading-inner">
        <div class="loading-logo">STELLAR WARS</div>
        <div class="loading-sub">LAST DEFENSE</div>
        <div class="loading-bar"><span id="loading-fill"></span></div>
        <div class="loading-text" id="loading-text">INITIALIZING</div>
      </div>
    </div>

    <div id="rotate-hint" class="hidden">
      <div class="rotate-icon">⟳</div>
      <p>Rotate your device for the best experience</p>
    </div>
  </div>

  <script src="assets/lib/babylon.js"></script>
  <script src="assets/lib/babylonjs.loaders.min.js"></script>
  <script type="module" src="src/main.js?v=23"></script>
</body>
</html>
